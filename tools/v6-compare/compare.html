<!doctype html>
<html
  ><head
    ><meta charset="utf-8" /><title>antd v6 vs ng-zorro</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: var(--ant-color-bg-layout, #f5f5f5);
        color: var(--ant-color-text, #000);
      }
      .cmp-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 16px;
      }
      .cmp-layout.single {
        grid-template-columns: 1fr;
      }
      .cmp-demo {
        padding: 16px;
        border: 1px solid var(--ant-color-border, #ddd);
        border-radius: 8px;
        margin-bottom: 16px;
        background: var(--ant-color-bg-container, #fff);
      }
      .cmp-demo-title {
        margin: 0 0 12px;
        font: 600 12px/1 sans-serif;
        color: var(--ant-color-text-secondary, #666);
      }
      iframe {
        width: 100%;
        height: 90vh;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
      }
    </style></head
  >
  <body>
    <div class="cmp-layout single" id="layout">
      <div id="antd-root"></div>
      <div id="site-pane" hidden></div>
    </div>
    <script>
      const p = new URLSearchParams(location.search);
      const component = p.get('component');
      if (!component) {
        document.getElementById('antd-root').textContent = 'Add ?component=<dir>&demo=<key>&theme=v6';
      } else {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = `demos/${component}.js`;
        document.body.appendChild(s);
        if (p.get('live')) {
          const site = p.get('site') || 'http://localhost:4200';
          const demo = p.get('demo');
          const pane = document.getElementById('site-pane');
          pane.hidden = false;
          document.getElementById('layout').classList.remove('single');
          pane.innerHTML = `<iframe src="${site}/components/${component}/en?theme=${p.get('theme') || 'v6'}${demo ? `#components-${component}-demo-${demo}` : ''}"></iframe>`;
        }
      }
    </script>
  </body></html
>
